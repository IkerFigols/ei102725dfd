<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <meta charset="UTF-8">
    <title>SgOvi - Menú Usuario</title>
</head>
<body>

<div layout:fragment="content">
    <section class="form-container" style="max-width: 600px;">

        <header class="app-header" style="margin-bottom: 30px;">
            <h1 class="title">Panel del Usuario (OVI)</h1>
            <p class="description">Bienvenido a tu panel de gestión personal. Selecciona una opción para continuar.</p>
        </header>

        <nav class="menu-grid">
            <a th:href="@{/Assistance_Request/apRequestList}" class="btn btn-primary">Mis solicitudes de asistencia</a>

            <a th:href="@{/Activity/list}" class="btn btn-primary">Mis actividades</a>

            <a th:href="@{/Contracts/list}" class="btn btn-primary">Mis contratos</a>
        </nav>

        <footer style="margin-top: 40px;">
            <div style="display: flex; justify-content: space-between; width: 100%;">
                <a th:href="@{/}" class="btn btn-secondary">Inicio</a>

                <a th:href="@{/logout}" class="btn btn-secondary">Cerrar sesión</a>
            </div>
        </footer>

    </section>
</div>

</body>
</html>
