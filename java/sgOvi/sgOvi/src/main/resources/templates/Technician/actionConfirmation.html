<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <meta charset="UTF-8" />
    <title>Acción Completada - SgOvi</title>
</head>
<body>

<div layout:fragment="content">
    <div class="success-container">
        <div style="margin-bottom: 20px; color: #166534;">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        </div>

        <h2 class="title">Acción Completada</h2>

        <p class="success-message" th:text="${mensaje}"></p>

        <div class="actions-group">
            <a th:href="@{/Technician/{lista} (lista= ${lista})}" class="btn btn-primary">Aceptar</a>
        </div>
    </div>
</div>

</body>
</html>
