<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <title>Editar Actividad</title>
    <meta charset="UTF-8" />
</head>
<body>
<h1>Editar PAP/PATI</h1>

<form th:action="@{/Technician/activityManagement/update}" th:object="${activity}" method="post">

    <p>
        <label for="idActivity">Identificador de la actividad:</label>
        <input type="text" id="idActivity" name="idActivity" th:field="*{idActivity}" readonly />
    </p>

    <p>
        <label for="tittle">Título:</label>
        <input type="text" id="tittle" name="tittle" th:field="*{tittle}" />
    </p>

    <p>
        <label for="description">Descripción:</label>
        <input type="text" id="description" name="description" th:field="*{description}" />
    </p>

    <p>

        <label for="type">Tipo de Actividad:</label>
        <select id="type" name="type">
            <option value="DISSEMINATION" th:selected="*{type == 'DISSEMINATION'}">Diseminacion</option>
            <option value="TRAINING" th:selected="*{type == 'TRAINING'}">Formación</option>
        </select>
    </p>
    <p>
        <label for="date">Fecha:</label>
        <input type="date" id="date" name="date" th:field="*{date}" />
    </p>
    <p>
        <label for="address">Dirección:</label>
        <input type="text" id="address" name="address" th:field="*{address}" />
    </p>
    <p>
        <label for="capacity">Capacidad:</label>
        <input type="number" id="capacity" name="capacity" th:field="*{capacity}" />
    </p>
    <p>
        <label for="sponsor">Sponsor:</label>
        <input type="text" id="sponsor" name="sponsor" th:field="*{sponsor}" />
    </p>
    <p>
        <label for="idInstructor">DNI del Instructor:</label>
        <input type="text" id="idInstructor" name="idInstructor" th:field="*{idInstructor}" />
    </p>
    <button type="submit">Guardar cambios</button>

</form>

<br><br>
<a th:href="@{/Technician/activityList}">Volver a la lista</a>

</body>
</html>
