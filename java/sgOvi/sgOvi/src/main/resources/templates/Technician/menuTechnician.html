<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}"> <head>
    <meta charset="UTF-8">
    <title>SgOvi - Panel Técnico</title>
</head>
<body>

<div layout:fragment="content">
    <section class="form-container" style="max-width: 600px;">
        <header class="app-header" style="margin-bottom: 30px;">
            <h1 class="title">Panel de Administración</h1>
            <p class="description">Seleccione una categoría para gestionar los registros del sistema.</p>
        </header>

        <nav class="menu-grid">
            <a th:href="@{/Technician/userList}" class="btn btn-primary">Lista de Usuarios</a>
            <a th:href="@{/Technician/papPatiList}" class="btn btn-primary">Lista de Asistentes</a>
            <a th:href="@{/Technician/instructorList}" class="btn btn-primary">Lista de Instructores</a>
            <a th:href="@{/Technician/assistanceRequestList}" class="btn btn-primary">Lista de Solicitudes de Asistencia</a>
            <a th:href="@{/Technician/activityList}" class="btn btn-primary">Lista de Actividades</a>
        </nav>

        <footer style="margin-top: 40px;">
            <div style="display: flex; justify-content: space-between; width: 100%;">
                <a th:href="@{/}" class="btn btn-secondary">Inicio</a>
                <a th:href="@{/logout}" class="btn btn-secondary">Cerrar sesión</a>
            </div>
        </footer>
    </section>
</div>

</body>
</html>
