<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <title>Gestionar Ovi Users</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="page-container" layout:fragment="content">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1 class="title">Lista de Ovi Users</h1>
    </div>

    <p class="description">Administre las cuentas de usuario y supervise su estado actual en el sistema.</p>

    <form th:action="@{/Technician/userList}" th:object="${filter}" method="post" class="filter-bar">

        <div class="filter-group">
            <label for="stateSel">Estado</label>
            <select th:field="*{stateSel}" id="stateSel" class="filter-select" onchange="this.form.submit()">
                <option value="ALL">Todos los estados</option>
                <option th:each="st : ${filter.stateList}"
                        th:value="${st.name()}"
                        th:text="${st.getDescription()}">
                </option>
            </select>
        </div>

        <div class="filter-group">
            <label for="sortSel">Ordenar por</label>
            <select th:field="*{sortSel}" id="sortSel" class="filter-select" onchange="this.form.submit()">
                <option value="nameAsc">Nombre (A-Z)</option>
                <option value="nameDesc">Nombre (Z-A)</option>
                <option value="dni">DNI</option>
            </select>
        </div>
    </form>
    <div class="table-responsive" th:if="${!users.isEmpty()}">
        <table class="table-custom">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>DNI</th>
                <th>Estado</th>
                <th style="text-align: center;">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user: ${users}">
                <td th:text="${user.person.name}"></td>
                <td th:text="${user.person.surname}"></td>
                <td th:text="${user.person.dni}"></td>
                <td>
                    <span th:text="${user.oviUser.state.getDescription()}"
                          th:class="${user.oviUser.state.name() == 'APPROVED' ? 'status-badge status-approved' :
                                     (user.oviUser.state.name() == 'PENDING' ? 'status-badge status-pending' : 'status-badge status-rejected')}">
                    </span>
                </td>
                <td>
                    <div class="actions-group-centered">
                        <a class="btn btn-primary btn-icon" title="Gestionar usuario OVI"
                           th:href="@{/Technician/userManagement/{dni}(dni=${user.person.dni})}">
                            Gestionar <i class="fi fi-rr-edit"></i>
                        </a>
                        <a class="btn btn-primary btn-icon" title="Ver contratos asociados al usuario"
                           th:href="@{/Technician/contractPersonList/{dni}(dni=${user.person.dni}, urlPast='userList')}">
                            Contratos <i class="fi fi-rr-document"></i>

                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(users)}" class="empty-list-container">
        <p class="empty-list-text">No se han encontrado usuarios con los filtros seleccionados.</p>
    </div>

    <div class="content-footer">
        <a href="/Technician/menuTechnician" class="btn btn-secondary btn-icon" title="Volver al menú de técnico">Volver al Menú <i class="fi fi-rr-home"></i> </a>
    </div>
</div>

</body>
</html>
