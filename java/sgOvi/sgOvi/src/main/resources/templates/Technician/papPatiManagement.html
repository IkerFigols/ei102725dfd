<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <title>Editar Pap/Pati</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="main-content">

<div class="page-container" layout:fragment="content">
    <div class="form-container">
        <h1 class="title">Editar PAP/PATI</h1>
        <p class="description">Modifique los datos del asistente y actualice su estado de validación en el sistema.</p>

        <form th:action="@{/Technician/papPatiManagement/update}" th:object="${papPati}" method="post">

            <div class="textarea-container">
                <label class="detail-label" for="dni">DNI:</label>
                <input type="text" id="dni" name="dni" th:value="*{dni}" class="textarea-read-only" readonly />
            </div>

            <div class="textarea-container" style="display: flex; align-items: center; gap: 10px; margin-bottom: 25px;">
                <label class="detail-label" for="available" style="width: auto; margin-bottom: 0;">Disponibilidad:</label>
                <input type="checkbox" id="available" name="available" value="true" th:checked="*{available}"/>
                <div th:if="${#fields.hasErrors('available')}" th:errors="*{available}" class="error-text"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="address">Dirección:</label>
                <input type="text" id="address" name="address" th:value="*{address}" class="textarea-field-small" required />
                <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="error-text"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="type">Tipo:</label>
                <select id="type" name="type" class="textarea-field-small">
                    <option value="PAP" th:selected="*{type.name() == 'PAP'}">PAP</option>
                    <option value="PATI" th:selected="*{type.name() == 'PATI'}">PATI</option>
                </select>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="training">Entrenamiento:</label>
                <input type="text" id="training" name="training" th:value="*{training}" class="textarea-field-small" required />
                <div th:if="${#fields.hasErrors('training')}" th:errors="*{training}" class="error-text"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="experience">Años de experiencia:</label>
                <input type="number" id="experience" name="experience" th:value="*{experience}" class="textarea-field-small" required />
                <div th:if="${#fields.hasErrors('experience')}" th:errors="*{experience}" class="error-text"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="document">Documento:</label>
                <input type="text" id="document" name="document" th:value="*{document}" class="textarea-field-small" required />
                <div th:if="${#fields.hasErrors('document')}" th:errors="*{document}" class="error-text"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="shift">Turno:</label>
                <select id="shift" name="shift" class="textarea-field-small">
                    <option value="MORNING" th:selected="*{shift.name() == 'MORNING'}">Mañana</option>
                    <option value="AFTERNOON" th:selected="*{shift.name() == 'AFTERNOON'}">Tarde</option>
                    <option value="ANY" th:selected="*{shift.name() == 'ANY'}">Cualquiera</option>
                </select>
            </div>

            <div class="textarea-container" style="display: flex; align-items: center; gap: 10px; margin-bottom: 25px;">
                <label class="detail-label" for="drivingLicense" style="width: auto; margin-bottom: 0;">Carné de Conducir:</label>
                <input type="checkbox" id="drivingLicense" name="drivingLicense" value="true" th:checked="*{drivingLicense}"/>
            </div>

            <div class="section-title">Estado de la Solicitud</div>

            <div class="textarea-container">
                <label class="detail-label" for="state">Estado:</label>
                <select id="state" name="state" class="textarea-field-small">
                    <option value="PENDING" th:selected="*{state.name() == 'PENDING'}">Pendiente</option>
                    <option value="APPROVED" th:selected= "*{state.name() == 'APPROVED'}">Aprobado</option>
                    <option value="REJECTED" th:selected="*{state.name() == 'REJECTED'}">Rechazado</option>
                </select>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="reason">Razón (En caso de denegación):</label>
                <input type="text" id="reason" name="reason" th:value="*{reason}" class="textarea-field-small" placeholder="Motivo del estado actual" />
                <div th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}" class="error-text"></div>
            </div>

            <div class="activities-actions">
                <button type="submit"
                        class="btn btn-primary"
                        th:data-dni="${papPati.dni}"
                        th:data-type="${papPati.type.name()}"
                        onclick="return confirm('¿Seguro que deseas guardar los cambios para el ' + this.getAttribute('data-type') + ' con dni ' + this.getAttribute('data-dni') + '?');">
                        Guardar cambios
                </button>
            </div>

        </form>

        <div class="content-footer">
            <a th:href="@{/Technician/papPatiList}" class="btn btn-secondary">Volver a la lista</a>
        </div>
    </div>

    <div class="bottom-spacer"></div>
</div>

</body>
</html>
