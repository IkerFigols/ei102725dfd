<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <title>Gestionar PAP/PATIs</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="page-container"layout:fragment="content">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1 class="title">Lista de Asistentes</h1>
    </div>
    <p class="description">Panel de control para la gestión de usuarios PAP/PATI y supervisión de sus estados de disponibilidad.</p>

    <form th:action="@{/Technician/papPatiList}" th:object="${filter}" method="post" class="filter-bar">

        <div class="filter-group">
            <label for="stateSel">Filtrar por Estado</label>
            <select th:field="*{stateSel}" id="stateSel" class="filter-select" onchange="this.form.submit()">
                <option value="ALL">Todos los estados</option>
                <option th:each="st : ${filter.stateList}"
                        th:value="${st.name()}"
                        th:text="${st.getDescription()}"> </option>
            </select>
        </div>

        <div class="filter-group">
            <label for="sortSel">Ordenar por</label>
            <select th:field="*{sortSel}" id="sortSel" class="filter-select" onchange="this.form.submit()">
                <option value="nameAsc">Nombre (A-Z)</option>
                <option value="nameDesc">Nombre (Z-A)</option>
                <option value="dni">DNI</option>
            </select>
        </div>

    </form>

    <div class="table-responsive"th:if="${!papPatis.isEmpty()}">
        <table class="table-custom">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>DNI</th>
                <th>Tipo</th>
                <th>Disponibilidad</th>
                <th>Estado</th>
                <th style="text-align: center;">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="papPati: ${papPatis}">
                <td th:text="${papPati.person.name}"></td>
                <td th:text="${papPati.person.surname}"></td>
                <td th:text="${papPati.person.dni}"></td>
                <td th:text="${papPati.papPati.type}"></td>
                <td th:text="${papPati.papPati.available ? 'Disponible' : 'No disponible'}"></td>
                <td>
                    <span th:text="${papPati.papPati.state.getDescription()}"
                          th:class="${papPati.papPati.state.name() == 'APPROVED' ? 'status-badge status-approved' :
                                     (papPati.papPati.state.name() == 'PENDING' ? 'status-badge status-pending' : 'status-badge status-rejected')}">
                    </span>
                </td>
                <td>
                    <div class="actions-group-centered" >
                        <a class="btn btn-primary btn-icon" title="Gestionar Asistente Personal"
                           th:href="@{/Technician/papPatiManagement/{dni}(dni=${papPati.person.dni})}">
                            Gestionar <i class="fi fi-rr-edit"></i>
                        </a>
                        <a class="btn btn-primary btn-icon" title="Ver contratos asociados"
                           th:href="@{/Technician/contractPersonList/{dni}(dni=${papPati.person.dni}, urlPast='papPatiList')}">
                            Contratos <i class="fi fi-rr-document"></i>
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(papPatis)}" class="empty-list-container">
        <p class="empty-list-text">No hay asistentes que coincidan con los criterios de búsqueda.</p>
    </div>

    <div class="content-footer ">
        <a href="/Technician/menuTechnician" class="btn btn-secondary btn-icon" title="Volver al menú del técnico"><i class="fi fi-rr-arrow-left"></i> Volver al Menú</a>
    </div>

</div>
</body>
</html>
