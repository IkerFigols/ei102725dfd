<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
  <title>Petición de asistencia</title>
  <meta charset="UTF-8" />
  <style>
    .request-details {
      list-style-type: none;
      padding-left: 0;
    }
    .request-details li {
      margin-bottom: 10px;
    }
    .form-actions {
      margin-top: 20px;
      border-top: 1px solid #ccc;
      padding-top: 15px;
    }
  </style>
</head>
<body>
<h1>Gestionar Petición de Asistencia</h1>

<form th:action="@{/Technician/apManagement/update}" th:object="${assistanceRequest}" method="post">

  <ul class="request-details">
    <li>
      <strong>Identificador:</strong>
      <span th:text="*{idAsReq}"></span>
      <input type="hidden" th:field="*{idAsReq}" />
    </li>

    <li>
      <strong>DNI Solicitante:</strong>
      <span th:text="*{idOviUser}"></span>
      <input type="hidden" th:field="*{idOviUser}" />
    </li>

    <li>
      <strong>Fecha:</strong>
      <span th:text="*{date}"></span>
      <input type="hidden" th:field="*{date}" />
    </li>

    <li>
      <strong>Descripción:</strong>
      <span th:text="*{description}"></span>
      <input type="hidden" th:field="*{description}" />
    </li>

    <li>
      <strong>Preferencia de edad:</strong>
      <span th:text="*{age}"></span>
      <input type="hidden" th:field="*{age}" />
    </li>

    <li>
      <strong>Años de experiencia:</strong>
      <span th:text="*{experience}"></span>
      <input type="hidden" th:field="*{experience}" />
    </li>

    <li>
      <strong>Preferencia de turno:</strong>
      <span th:text="*{shiftPreference}"></span>
      <input type="hidden" name="shiftPreference" th:value="*{shiftPreference != null ? shiftPreference.name() : ''}" />
    </li>

    <li>
      <strong>Carné de conducir:</strong>
      <span th:text="*{drivingLicense} ? 'Sí' : 'No'"></span>
      <input type="hidden" th:field="*{drivingLicense}" />
    </li>

    <li>
      <strong>Ciudad:</strong>
      <span th:text="*{city}"></span>
      <input type="hidden" th:field="*{city}" />
    </li>

    <li>
      <strong>Provincia:</strong>
      <span th:text="*{province}"></span>
      <input type="hidden" th:field="*{province}" />
    </li>

    <li>
      <strong>Estado:</strong>
      <span th:text="*{state}"></span>
      <input type="hidden" name="state" th:value="*{state != null ? state.getDescription() : ''}" />
    </li>

    <li th:if="${assistanceRequest.getState().name() == 'REJECTED'}">
      <strong>Razón:</strong>
      <span th:text="*{reason}"></span>
      <input type="hidden" th:field="*{reason}" />
    </li>
  </ul>

  <div class="form-actions" th:if="${assistanceRequest.getState().name() == 'PENDING'}">
    <p>
      <label>Acción sobre la solicitud:</label>
    </p>

    <div style="display: flex; gap: 15px; margin-bottom: 20px;">
      <button type="submit"
              th:formaction="@{/Technician/apManagement/accept}"
              style="background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
        Aceptar
      </button>

      <button type="submit"
              th:formaction="@{/Technician/apManagement/reject}"
              style="background-color: #dc3545; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
        Denegar
      </button>
    </div>

    <p>
      <label for="reason">Razón de la denegación (rellenar antes de denegar):</label>
      <input type="text" id="reason" name="reason" th:field="*{reason}" />
      <div th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>

    </p>

  </div>
</form>

<br><br>
<a th:href="@{/Technician/assistanceRequestList}">Volver a la lista</a>

</body>
</html>
