<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <title>Lista de participantes</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="page-container" layout:fragment="content">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1 class="title"> Lista de participantes</h1>
        </div>
        <p class="description" th:text="'Lista de Asistentes Personales que participan en la actividad de formación: '+ ${idActivity}">.</p>

        <form th:action="@{/Technician/activityList/participants/{idActivity} (idActivity=${idActivity})}" th:object="${filter}" method="get" class="filter-bar">
            <div class="filter-group">
                <label for="sortSel">Ordenar por: </label>
                <select th:field="*{sortSel}" id="sortSel" class="filter-select" onchange="this.form.submit()">
                    <option value="nameAsc">Nombre (A-Z)</option>
                    <option value="nameDesc">Nombre (Z-A)</option>
                    <option value="dni">DNI</option>
                </select>
            </div>

        </form>
        <div class="table-responsive" th:if="${!participantes.isEmpty()}">
            <table class="table-custom">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>DNI</th>
                    <th>Tipo</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="papPati: ${participantes}">
                    <td th:text="${papPati.person.name}"></td>
                    <td th:text="${papPati.person.surname}"></td>
                    <td th:text="${papPati.person.dni}"></td>
                    <td th:text="${papPati.papPati.type}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${#lists.isEmpty(participantes)}" class="empty-list-container">
            <p class="empty-list-text">No hay asistentes que coincidan con los criterios de búsqueda en la actividad.</p>
        </div>
        <div class="content-footer">
            <a href="/Technician/activityList" class="btn btn-secondary btn-icon" title="Volver al listado de actividades"><i class="fi fi-rr-arrow-left"></i> Volver al Listado</a>
        </div>
    </div>
</body>
</html>
