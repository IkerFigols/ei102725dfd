<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <title>Lista de solicitudes de asistencia</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-container" layout:fragment="content">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1 class="title">Lista solicitudes de asistencia</h1>

    </div>

    <p class="description">Gestión y revisión de las peticiones de soporte técnico.</p>

    <form th:action="@{/Technician/assistanceRequestList}" th:object="${filter}" method="post" class="filter-bar">

        <div class="filter-group">
            <label for="stateSel">Estado</label>
            <select th:field="*{stateSel}" id="stateSel" class="filter-select" onchange="this.form.submit()">
                <option value="ALL">Todos los estados</option>
                <option th:each="st : ${filter.stateList}"
                        th:value="${st.name()}"
                        th:text="${st.getDescription()}"></option>
            </select>
        </div>

        <div class="filter-group">
            <label for="sortSel">Ordenar por</label>
            <select th:field="*{sortSel}" id="sortSel" class="filter-select" onchange="this.form.submit()">
                <option value="id">ID Solicitud</option>
                <option value="fechaAsc">Fecha (Antiguas primero)</option>
                <option value="fecDesc">Fecha (Recientes primero)</option>
            </select>
        </div>
    </form>

    <div class="table-responsive" th:if="${!assistanceRequests.isEmpty()}">
        <table class="table-custom">
            <thead>
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Motivo</th>
                <th>Estado</th>
                <th style="text-align: center;">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="request: ${assistanceRequests}">
                <td th:text="${request.idAsReq}"></td>
                <td th:text="${request.date}"></td>
                <td th:text="${request.tittle}"></td>
                <td>
                    <span th:text="${request.state.getDescription()}"
                          th:class="${'status-badge ' +
                                     (request.state.name() == 'APPROVED' ? 'status-approved' :
                                     (request.state.name() == 'PENDING' ? 'status-pending' :
                                     (request.state.name() == 'REJECTED' ? 'status-rejected' : 'status-closed')))}">
                    </span>
                </td>
                <td>
                    <div class="actions-group-centered">
                        <a class="btn btn-primary btn-icon" title="Gestionar Solicitud"
                           th:href="@{/Technician/apManagement/{idAsReq}(idAsReq=${request.idAsReq})}">
                            Gestionar <i class="fi fi-rr-edit"></i>
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(assistanceRequests)}" class="empty-list-container">
        <p class="empty-list-text">No se han encontrado solicitudes con estos filtros.</p>
    </div>
    <div class="content-footer">
        <a href="/Technician/menuTechnician" class="btn btn-secondary btn-icon" title="Volver al menú del técnico">Volver al Menú <i class="fi fi-rr-home"></i> </a>
    </div>
</div>
</body>
</html>
