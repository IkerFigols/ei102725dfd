<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <title>Editar Instructor</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="main-content">

<div class="page-container" layout:fragment="content">
    <div class="form-container">
        <h1 class="title">Editar Instructor/a</h1>
        <p class="description">Actualice la información profesional del instructor seleccionado.</p>

        <form th:action="@{/Technician/instructorManagement/update}" th:object="${instructor}" method="post">

            <div class="textarea-container">
                <label class="detail-label" for="dni">DNI (No editable):</label>
                <input type="text" id="dni" name="dni" th:value="*{dni}" class="textarea-read-only" readonly />
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="expertise">Especialidad:</label>
                <input type="text" id="expertise" name="expertise" th:value="*{expertise}" class="textarea-field-small" placeholder="Ej: Fisioterapia, Geriatría..." />
                <div th:if="${#fields.hasErrors('expertise')}" th:errors="*{expertise}" class="error-text"></div>
            </div>

            <div class="activities-actions">
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
            </div>

        </form>

        <div class="content-footer">
            <a th:href="@{/Technician/instructorList}" class="btn btn-secondary">Volver a la lista</a>
        </div>
    </div>
</div>

</body>
</html>
