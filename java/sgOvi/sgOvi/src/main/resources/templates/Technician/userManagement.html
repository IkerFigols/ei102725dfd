<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
  <title>Editar Ovi User</title>
  <meta charset="UTF-8" />
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div layout:fragment="content">
  <div class="page-container">
    <h1 class="title">Editar Ovi User</h1>
    <p class="description">Actualice la información de contacto y el estado de validación del usuario en el sistema.</p>

    <form th:action="@{/Technician/userManagement/update}" th:object="${user}" method="post">

      <div class="textarea-container">
        <label class="detail-label" for="dni">DNI:</label>
        <input type="text" id="dni" name="dni" th:value="*{dni}" class="textarea-read-only" readonly />
      </div>

      <div class="textarea-container">
        <label class="detail-label" for="address">Dirección:</label>
        <input type="text" id="address" name="address" th:value="*{address}" class="textarea-field-small" required />
        <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="error-text"></div>
      </div>

      <div class="textarea-container">
        <label class="detail-label" for="legalGuardian">Tutor Legal:</label>
        <input type="text" id="legalGuardian" name="legalGuardian" th:value="*{legalGuardian}" class="textarea-field-small" />
        <div th:if="${#fields.hasErrors('legalGuardian')}" th:errors="*{legalGuardian}" class="error-text"></div>
      </div>

      <div class="section-title">Estado de la cuenta</div>

      <div class="textarea-container">
        <label class="detail-label" for="state">Estado:</label>
        <select id="state" name="state" class="textarea-field-small">
          <option value="APPROVED" th:selected="*{state.name() == 'APPROVED'}">Aprobado</option>
          <option value="REJECTED" th:selected="*{state.name() == 'REJECTED'}">Rechazado</option>
          <option value="PENDING" th:selected="*{state.name() == 'PENDING'}">Pendiente</option>
        </select>
      </div>

      <div class="textarea-container">
        <label class="detail-label" for="reason">Razón:</label>
        <input type="text" id="reason" name="reason" th:value="*{reason}" class="textarea-field-small" placeholder="Indique el motivo del cambio de estado" />
        <div th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}" class="error-text"></div>
      </div>
      <div class="content-footer">
        <a th:href="@{/Technician/userList}" class="btn btn-secondary btn-icon" title="Volver al listado de usuarios OVI"><i class="fi fi-rr-arrow-left"></i> Volver al listado</a>
        <button type="submit"
                class="btn btn-secondary btn-icon" title="Actualiar usuario OVI"
                th:data-dni="${user.dni}"
                onclick="return confirm('¿Seguro que deseas guardar los cambios para el dni ' + this.getAttribute('data-dni') + '?');">
          Actualizar Usuario OVI <i class="fi fi-rr-edit"></i>
        </button>
      </div>
    </form>

  </div>

</div>

</body>
</html>
