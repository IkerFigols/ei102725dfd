<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8" />
    <title>Crear nueva persona</title>
</head>


<body>
<main>
    <h1>Nuevo Instructor/a</h1>
    <form th:action="@{/Technician/addInstructor}" th:object="${personInstructor}" method="post">
        <div>
            <label for="dni">Dni: </label>
            <input id="dni" type="text" th:field="*{person.dni}">
            <div th:if="${#fields.hasErrors('person.dni')}" th:errors="*{person.dni}" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>

        </div>

        <div>
            <label for="name">Nombre: </label>
            <input id="name" type="text" th:field="*{person.name}">
            <div th:if="${#fields.hasErrors('person.name')}" th:errors="*{person.name}" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>
        </div>

        <div>
            <label for="surname">Apellidos: </label>
            <input id="surname" type="text" th:field="*{person.surname}">
            <div th:if="${#fields.hasErrors('person.surname')}" th:errors="*{person.surname}" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>
        </div>

        <div>
            <label for="birthdayDate">Fecha de Nacimiento: </label>
            <input id="birthdayDate" type="date" th:field="*{person.birthdayDate}">
            <div th:if="${#fields.hasErrors('person.birthdayDate')}" th:errors="*{person.birthdayDate}" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>
        </div>

        <div>
            <label for="phoneNumber">Número de teléfono: </label>
            <input id="phoneNumber" type="text" th:field="*{person.phoneNumber}">
            <div th:if="${#fields.hasErrors('person.phoneNumber')}" th:errors="*{person.phoneNumber}" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>
        </div>

        <div>
            <label for="email">Email: </label>
            <input id="email" type="text" th:field="*{person.email}">
            <div th:if="${#fields.hasErrors('person.email')}" th:errors="*{person.email}" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>
        </div>

        <div>
            <label for="gender">Género:</label>
            <select id="gender" name="person.gender">
                <option value="MALE" th:selected="*{person.gender?.name() == 'MALE'}">Masculino</option>
                <option value="FEMALE" th:selected="*{person.gender?.name() == 'FEMALE'}">Femenino</option>
                <option value="UNDEFINED" th:selected="*{person.gender?.name() == 'UNDEFINED'}">Otros</option>
            </select>
            <div th:if="${#fields.hasErrors('person.gender')}" th:errors="*{person.gender}" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>
        </div>

        <div>
            <label for="password">Contraseña: </label>
            <input id="password" type="password" th:field="*{person.password}">
            <div th:if="${#fields.hasErrors('person.password')}" th:errors="*{person.password}" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>

        </div>

        <div>
            <label for="city">Ciudad: </label>
            <input id="city" type="text" th:field="*{person.city}">
            <div th:if="${#fields.hasErrors('person.city')}" th:errors="*{person.city}" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>

        </div>

        <div>
            <label for="province">Provincia: </label>
            <input id="province" type="text" th:field="*{person.province}">
            <div th:if="${#fields.hasErrors('person.province')}" th:errors="*{person.province}" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>

        </div>

        <div></div>

        <div>
            <label for="expertise">Especialidad: </label>
            <input id="expertise" type="text" th:field="*{instructor.expertise}">
            <div th:if="${#fields.hasErrors('instructor.expertise')}" th:errors="*{instructor.expertise}" style="color: red; font-size: 0.9em; margin-top: 5px;"></div>

        </div>

        <button type="submit">Añadir instructor</button>


    </form>
</main>
</body>
</html>
