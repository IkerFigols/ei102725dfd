<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <meta charset="UTF-8" />
    <title>Crear nueva persona</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="main-content">
<main class="page-container" layout:fragment="content">
    <div class="form-container">
        <h1 class="title">Nuevo Instructor/a</h1>
        <p class="description">Complete los datos personales y profesionales para registrar un nuevo instructor en la plataforma.</p>

        <form th:action="@{/Technician/addInstructor}" th:object="${personInstructor}" method="post">

            <div class="textarea-container">
                <label class="detail-label" for="dni">DNI:</label>
                <input id="dni" type="text" th:field="*{person.dni}" class="textarea-field-small" placeholder="Ej: 12345678A">
                <div th:if="${#fields.hasErrors('person.dni')}" th:errors="*{person.dni}" class="error-text"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="name">Nombre:</label>
                <input id="name" type="text" th:field="*{person.name}" class="textarea-field-small">
                <div th:if="${#fields.hasErrors('person.name')}" th:errors="*{person.name}" class="error-text"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="surname">Apellidos:</label>
                <input id="surname" type="text" th:field="*{person.surname}" class="textarea-field-small">
                <div th:if="${#fields.hasErrors('person.surname')}" th:errors="*{person.surname}" class="error-text"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="birthdayDate">Fecha de Nacimiento:</label>
                <input id="birthdayDate" type="date" th:field="*{person.birthdayDate}" class="textarea-field-small">
                <div th:if="${#fields.hasErrors('person.birthdayDate')}" th:errors="*{person.birthdayDate}" class="error-text"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="phoneNumber">Número de teléfono:</label>
                <input id="phoneNumber" type="text" th:field="*{person.phoneNumber}" class="textarea-field-small">
                <div th:if="${#fields.hasErrors('person.phoneNumber')}" th:errors="*{person.phoneNumber}" class="error-text"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="email">Email:</label>
                <input id="email" type="text" th:field="*{person.email}" class="textarea-field-small" placeholder="ejemplo@correo.com">
                <div th:if="${#fields.hasErrors('person.email')}" th:errors="*{person.email}" class="error-text"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="gender">Género:</label>
                <select id="gender" name="person.gender" class="textarea-field-small">
                    <option value="MALE" th:selected="*{person.gender?.name() == 'MALE'}">Masculino</option>
                    <option value="FEMALE" th:selected="*{person.gender?.name() == 'FEMALE'}">Femenino</option>
                    <option value="UNDEFINED" th:selected="*{person.gender?.name() == 'UNDEFINED'}">Otros</option>
                </select>
                <div th:if="${#fields.hasErrors('person.gender')}" th:errors="*{person.gender}" class="error-text"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="password">Contraseña:</label>
                <input id="password" type="password" th:field="*{person.password}" class="textarea-field-small">
                <div th:if="${#fields.hasErrors('person.password')}" th:errors="*{person.password}" class="error-text"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="city">Ciudad:</label>
                <input id="city" type="text" th:field="*{person.city}" class="textarea-field-small">
                <div th:if="${#fields.hasErrors('person.city')}" th:errors="*{person.city}" class="error-text"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="province">Provincia:</label>
                <input id="province" type="text" th:field="*{person.province}" class="textarea-field-small">
                <div th:if="${#fields.hasErrors('person.province')}" th:errors="*{person.province}" class="error-text"></div>
            </div>

            <div class="section-title">Información Profesional</div>

            <div class="textarea-container">
                <label class="detail-label" for="expertise">Especialidad:</label>
                <input id="expertise" type="text" th:field="*{instructor.expertise}" class="textarea-field-small" placeholder="Ej: Fisioterapia, Psicología...">
                <div th:if="${#fields.hasErrors('instructor.expertise')}" th:errors="*{instructor.expertise}" class="error-text"></div>
            </div>

            <div class="activities-actions">
                <button type="submit" class="btn btn-primary">Añadir instructor</button>
            </div>
        </form>

        <div class="content-footer">
            <a th:href="@{/Technician/instructorList}" class="btn btn-secondary">Volver a la lista</a>
        </div>
    </div>
</main>
</body>
</html>
