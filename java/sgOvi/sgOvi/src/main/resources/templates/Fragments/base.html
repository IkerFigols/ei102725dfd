<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SgOvi</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" th:href="@{/images/logo_ovi.png}">

    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css'>

    <th:block layout:fragment="specific-css"></th:block>
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a th:href="@{/}" class="nav-brand">
            <img th:src="@{/images/logo_ovi.png}" alt="Logo" class="nav-logo-small">
            <span>SgOvi</span>
        </a>

        <div>
            <div class="login-info" th:if="${session.user != null}">
                <span class="user-name">Hola, <strong th:text="${session.user.getName()}">Usuario</strong></span>


                <a th:href="@{/logout}" class="btn-logout">Salir</a>
            </div>

            <div class="login-info" th:if="${session.user == null}">
                <a th:href="@{/login}" class="btn-login-nav">Iniciar Sesión</a>
            </div>
        </div>
    </div>
</nav>

<main class="main-content">
    <div layout:fragment="content">
    </div>
</main>

<footer class="app-footer">
    <div class="footer-container">
        <p>Contacto: <strong>ovicastello@gmail.com</strong></p>
        <p class="academic-text">EI1027 - Disseny i Implementació de Sistemes d'Informació</p>
    </div>
</footer>

</body>
</html>
