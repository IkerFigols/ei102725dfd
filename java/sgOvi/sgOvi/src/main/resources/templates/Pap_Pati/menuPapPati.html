<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <meta charset="UTF-8">
    <title>SgOvi - Menú Asistente</title>
</head>
<body>

<div layout:fragment="content">
    <section class="form-container" style="max-width: 600px;">
        <header class="app-header" style="margin-bottom: 30px;">
            <h1 class="title">Panel del Asistente (PAP/PATI)</h1>
            <p class="description">Bienvenido a tu panel de gestión. Selecciona una opción para continuar.</p>
            <a th:href="@{/}" class="btn btn-secondary" style="font-size: 12px; padding: 5px 15px; margin-bottom: 20px;">
                ← Cerrar Sesión / Inicio
            </a>
        </header>

        <nav class="menu-grid">
            <a th:href="@{/Pap_Pati/activityList}" class="btn btn-primary">Lista de actividades</a>

            <a th:href="@{/Pap_Pati/apRequestList}" class="btn btn-primary">Lista de APs</a>

            <a th:href="@{/Pap_Pati/contracts}" class="btn btn-primary">Lista de contratos</a>

            <a th:href="@{/Pap_Pati/changePreferences}" class="btn btn-primary">Cambiar preferencias</a>
        </nav>
    </section>
</div>

</body>
</html>
