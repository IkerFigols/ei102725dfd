<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <meta charset="UTF-8" />
    <title>SgOvi - Mis Solicitudes</title>
</head>
<body>

<div layout:fragment="content">
    <section class="form-container">

        <header class="app-header">
            <h1 class="title">Solicitudes de Asistencia</h1>
            <p class="description">Listado de servicios donde colaboras.</p>
        </header>

        <div class="info-card-container">
            <form th:action="@{/Pap_Pati/APList}" method="get" class="filter-bar">

                <div class="filter-group">
                    <label>Filtrar por estado:</label>
                    <select name="state" class="filter-select" onchange="this.form.submit()">
                        <option th:each="st : ${filter.stateList}"
                                th:value="${st}"
                                th:text="${st.getDescription()}"
                                th:selected="${st.name() == filter.stateSel}">
                        </option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Ordenar por:</label>
                    <select name="sort" class="filter-select" onchange="this.form.submit()">
                        <option value="dateDesc" th:selected="${filter.sortSel == 'dateDesc'}">Fecha (Más reciente)</option>
                        <option value="dateAsc" th:selected="${filter.sortSel == 'dateAsc'}">Fecha (Más antigua)</option>
                        <option value="titleAsc" th:selected="${filter.sortSel == 'titleAsc'}">Título (A-Z)</option>
                    </select>
                </div>
            </form>
        </div>

        <div class="table-responsive" th:if="${not #lists.isEmpty(requests)}">
            <table class="table-custom">
                <thead>
                <tr style="text-align: center">
                    <th>Título</th>
                    <th>Fecha Inicio</th>
                    <th>Usuario OVI</th>
                    <th>Estado</th>
                    <th class="text-right">Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${requests}">
                    <td th:text="${item.assistanceRequest.tittle}" class="text-important"></td>

                    <td th:text="${item.assistanceRequest.date != null ? #temporals.format(item.assistanceRequest.date, 'dd/MM/yyyy') : '--/--/----'}"></td>
                    <td th:text="${item.oviUserName}"></td>
                    <td>
                        <span th:text="${item.selectionState == 'APPROVED' ? 'Aprobada' : (item.selectionState == 'PENDING' ? 'Pendiente' : 'Rechazada')}"
                              th:class="'status-badge ' + (${item.selectionState == 'APPROVED'} ? 'status-approved' : (${item.selectionState == 'PENDING'} ? 'status-pending' : 'status-rejected'))">
                        </span>
                    </td>
                    <td class="text-right">
                        <form th:action="@{/Pap_Pati/papPatiAssistances}" method="post" title="ver detalles">
                            <input type="hidden" name="idSelection" th:value="${item.idSelection}" />
                            <button type="submit" class="btn btn-primary btn-sm btn-icon">
                                Detalles<i class="fi fi-rr-eye"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${#lists.isEmpty(requests)}" class="empty-list-container">
            <p class="empty-list-text">
                No dispone de asistencias personales.
            </p>
        </div>

        <div class="content-footer">
            <a th:href="@{/Pap_Pati/menuPapPati}" class="btn btn-secondary btn-icon"
            title="Volver al menú">
                Menú<i class="fi fi-rr-home"></i>
            </a>
        </div>
    </section>

    <div class="bottom-spacer"></div>
</div>

</body>
</html>
