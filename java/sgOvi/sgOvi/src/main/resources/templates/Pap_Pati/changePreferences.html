<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <meta charset="UTF-8">
    <title>SgOvi - Cambiar Preferencias</title>
</head>
<body>

<div layout:fragment="content">
    <main class="main-content">
        <section class="form-container">

            <header class="app-header">
                <h1 class="title">Mis Preferencias</h1>
                <p class="description">Gestione su disponibilidad y requisitos de transporte.</p>
            </header>

            <form th:action="@{/Pap_Pati/changePreferences}" th:object="${obj}" method="post">
                <input type="hidden" th:field="*{dni}" />

                <div class="form-group">
                    <p>
                        <strong>Tu turno actual es:</strong>
                        <span class="badge" th:text="${obj.shift != null ? obj.shift.description : 'Ninguno'}">Mañana</span>
                    </p>

                    <p>&nbsp;</p>

                    <label class="label" for="shift">Cambiar a un nuevo turno:</label>
                    <select id="shift" name="shift" class="input-field">
                        <option th:each="shiftOpt : ${T(es.uji.ei1027.sgOvi.model.enums.ShiftType).values()}"
                                th:value="${shiftOpt.name()}"
                                th:text="${shiftOpt.description}"
                                th:selected="${obj.shift != null and obj.shift.name() == shiftOpt.name()}">
                        </option>
                    </select>
                </div>

                <h2 class="section-title">Requisitos de transporte</h2>

                <div class="form-group">
                    <div class="checkbox-container">
                        <input type="checkbox" id="drivingLicense" th:field="*{drivingLicense}" />
                        <label class="label" for="drivingLicense" style="margin-bottom: 0;">
                            Marcar si dispone de carnet de conducir
                        </label>
                    </div>
                </div>

                <div th:if="${errorShift != null or errorLicense != null}"
                     class="status-badge status-rejected">
                    <div th:if="${errorShift != null}" th:text="${errorShift}"></div>
                    <div th:if="${errorLicense != null}" th:text="${errorLicense}"></div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    <a th:href="@{/Pap_Pati/menuPapPati}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
    <div class="bottom-spacer"></div>
</div>

</body>
</html>
