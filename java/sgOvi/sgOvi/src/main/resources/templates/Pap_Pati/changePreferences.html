<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <meta charset="UTF-8">
    <title>SgOvi - Cambiar Preferencias</title>
</head>
<body>

<div layout:fragment="content">
    <main class="main-content">
        <section class="form-container" style="max-width: 500px;">

            <header class="app-header">
                <h1 class="title">Mis Preferencias</h1>
                <p class="description">Gestione su disponibilidad y requisitos de transporte.</p>
            </header>

            <form action="#" th:action="@{/Pap_Pati/changePreferences}" th:object="${obj}" method="post">
                <input type="hidden" th:field="*{dni}" />

                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
                    <p style="margin-bottom: 10px;">
                        <strong>Tu turno actual es:</strong>
                        <span class="badge" style="background: #e2e8f0; padding: 4px 8px; border-radius: 4px;"
                              th:text="${obj.shift != null ? obj.shift.description : 'Ninguno'}">Mañana</span>
                    </p>

                    <label class="label" for="shift">Cambiar a:</label>
                    <select id="shift" name="shift" class="input-field" style="width: 100%;">
                        <option th:each="shiftOpt : ${T(es.uji.ei1027.sgOvi.model.enums.ShiftType).values()}"
                                th:value="${shiftOpt.name()}"
                                th:text="${shiftOpt.description}"
                                th:selected="${obj.shift != null and obj.shift.name() == shiftOpt.name()}">
                        </option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 25px;">
                    <p style="margin-bottom: 10px;">
                        <strong>Estado actual del carnet:</strong>
                        <span th:text="${obj.drivingLicense ? 'Dispone de carnet' : 'No dispone de carnet'}"></span>
                    </p>

                    <div style="display: flex; align-items: center; gap: 12px; background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0;">
                        <input type="checkbox" id="drivingLicense" th:field="*{drivingLicense}"
                               style="width: 18px; height: 18px; cursor: pointer;" />
                        <label class="label" for="drivingLicense" style="margin-bottom: 0; cursor: pointer;">
                            Marcar si dispone de carnet de conducir
                        </label>
                    </div>
                </div>

                <div th:if="${errorShift != null or errorLicense != null}"
                     style="margin-bottom: 20px; padding: 12px; background-color: #fee2e2; border: 1px solid #fca5a5; border-radius: 6px; color: #dc2626; text-align: center; font-weight: 500; font-size: 0.9rem;">

                    <div th:if="${errorShift != null}" th:text="${errorShift}"></div>
                    <div th:if="${errorLicense != null}" th:text="${errorLicense}"></div>

                </div>

                <div style="display: flex; gap: 15px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Guardar Cambios</button>
                    <a th:href="@{/Pap_Pati/menuPapPati}" class="btn btn-secondary"
                       style="flex: 1; text-align: center; text-decoration: none; line-height: 2.4;">
                        Cancelar
                    </a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
