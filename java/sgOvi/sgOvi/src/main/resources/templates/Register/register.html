<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>SgOvi - Registro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" th:href="@{/images/logo_ovi.png}">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css'>

</head>
<body>
<div th:replace="~{Fragments/general_fragment :: navbar-simple}"></div>

<main class="main-content">
    <section class="page-container">
        <header class="app-header" style="margin-bottom: 20px;">
            <h1 class="title">Registro de Usuario</h1>
            <p class="description">Introduce tus datos para formar parte de la comunidad OVI.</p>
        </header>

        <form th:action="@{/Register/register}" th:object="${person}" method="post">

            <div class="info-grid" style="grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="textarea-container">
                    <label for="dni" class="title" style="font-size: 14px;">DNI / NIE:</label>
                    <input id="dni" type="text" th:field="*{dni}" class="textarea-field-small" placeholder="12345678X">
                    <div th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
                </div>

                <div class="textarea-container">
                    <label for="name" class="title" style="font-size: 14px;">Nombre:</label>
                    <input id="name" type="text" th:field="*{name}" class="textarea-field-small" placeholder="Tu nombre">
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
                </div>

                <div class="textarea-container">
                    <label for="surname" class="title" style="font-size: 14px;">Apellidos:</label>
                    <input id="surname" type="text" th:field="*{surname}" class="textarea-field-small" placeholder="Tus apellidos">
                    <div th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
                </div>

                <div class="textarea-container">
                    <label for="phoneNumber" class="title" style="font-size: 14px;">Teléfono:</label>
                    <input id="phoneNumber" type="text" th:field="*{phoneNumber}" class="textarea-field-small" placeholder="600000000">
                    <div th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
                </div>

                <div class="textarea-container">
                    <label for="email" class="title" style="font-size: 14px;">Correo electrónico:</label>
                    <input id="email" type="text" th:field="*{email}" class="textarea-field-small" placeholder="ejemplo@correo.com">
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
                </div>

                <div class="textarea-container">
                    <label for="password" class="title" style="font-size: 14px;">Contraseña:</label>
                    <input id="password" type="password" th:field="*{password}" class="textarea-field-small" placeholder="••••••••">
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
                </div>

                <div class="textarea-container">
                    <label for="city" class="title" style="font-size: 14px;">Ciudad:</label>
                    <input id="city" type="text" th:field="*{city}" class="textarea-field-small" placeholder="Tu ciudad">
                    <div th:if="${#fields.hasErrors('city')}" th:errors="*{city}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
                </div>

                <div class="textarea-container">
                    <label for="province" class="title" style="font-size: 14px;">Provincia:</label>
                    <input id="province" type="text" th:field="*{province}" class="textarea-field-small" placeholder="Tu provincia">
                    <div th:if="${#fields.hasErrors('province')}" th:errors="*{province}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
                </div>
            </div>

            <fieldset class="textarea-container">
                <legend class="title" style="font-size: 14px; display: block; margin-bottom: 10px;">Género:</legend>
                <div style="display: flex; gap: 20px;">
                    <span><input type="radio" id="masculino" value="MALE" th:field="*{gender}"> <label for="masculino">Masculino</label></span>
                    <span><input type="radio" id="femenino" value="FEMALE" th:field="*{gender}"> <label for="femenino">Femenino</label></span>
                    <span><input type="radio" id="otros" value="UNDEFINED" th:field="*{gender}"> <label for="otros">Otros</label></span>
                </div>
                <div th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </fieldset>

            <div class="textarea-container">
                <label for="birthdaydate" class="title" style="font-size: 14px;">Fecha de nacimiento:</label>
                <input id="birthdaydate" type="date" th:field="*{birthdayDate}" class="textarea-field-small">
                <div th:if="${#fields.hasErrors('birthdayDate')}" th:errors="*{birthdayDate}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </div>

            <fieldset class="textarea-container" style="background-color: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid var(--border-gray);">
                <legend class="title" style="font-size: 14px; display: block; margin-bottom: 10px;">¿Qué perfil deseas registrar?</legend>
                <div style="margin-bottom: 10px;">
                    <input type="radio" id="pappati" value="PapPati" th:field="*{preference}">
                    <label for="pappati"><strong>Asistente Personal</strong> (Profesional)</label>
                </div>
                <div>
                    <input type="radio" id="oviuser" value="OviUser" th:field="*{preference}">
                    <label for="oviuser"><strong>Usuario OVI</strong> (Diversidad funcional)</label>
                </div>
                <div th:if="${#fields.hasErrors('preference')}" th:errors="*{preference}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </fieldset>

            <div class="textarea-container">
                <input type="checkbox" id="dataProtection" th:field="*{dataProtection}">
                <label for="dataProtection" style="font-size: 0.9em;">
                    Acepto la <a href="https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673" target="_blank" style="color: var(--primary-blue); font-weight: bold;">política de protección de datos (LOPD)</a>
                </label>
                <div th:if="${#fields.hasErrors('dataProtection')}" th:errors="*{dataProtection}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <button type="submit" class="btn btn-primary btn-icon" style="width: 200px;" title="Registrarse"
                        th:data-dni="${person.dni}"
                        onclick="return confirm('¿Seguro que deseas registrarte con el dni ' + this.getAttribute('data-dni') + '?');"
                >Registrarse <i class="fi fi-rr-clipboard-list"></i>
                </button>
                <p style="margin-top: 15px; font-size: 13px;">¿Ya tienes cuenta? <a th:href="@{/login}" style="color: var(--primary-blue); font-weight: bold;">Inicia sesión</a></p>
            </div>

        </form>
        <a th:href="@{/}" class="btn btn-secondary btn-icon"> <i class="fi fi-rr-arrow-left"></i> Volver al inicio</a>
    </section>
</main>

<div th:replace="~{Fragments/general_fragment :: footer-simple}"></div>
</body>
</html>
