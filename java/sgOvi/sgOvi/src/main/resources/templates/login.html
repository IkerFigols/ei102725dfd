<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>SgOvi - Acceso</title>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" th:href="@{/images/logo_ovi.png}">
</head>
<body>
<div th:replace="~{Fragments/general_fragment :: navbar-simple}"></div>

<main class="main-content">
    <section class="form-container" style="max-width: 450px;">
        <header class="app-header">
            <h1 class="title">Acceso</h1>
            <p class="description">Identifícate para gestionar tu perfil en SgOvi</p>
        </header>

        <form th:action="@{/login}" th:object="${user}" method="post">

            <div class="textarea-container">
                <label for="dni" class="title" style="font-size: 14px; display: block; margin-bottom: 8px;">DNI / NIE:</label>
                <input id="dni" type="text" th:field="*{dni}" class="textarea-field-small" placeholder="Escribe tu DNI" />
                <div th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </div>

            <div class="textarea-container">
                <label for="password" class="title" style="font-size: 14px; display: block; margin-bottom: 8px;">Contraseña:</label>
                <input id="password" type="password" th:field="*{password}" class="textarea-field-small" placeholder="••••••••" />
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Acceder</button>
            </div>
        </form>

    </section>
</main>

<div th:replace="~{Fragments/general_fragment :: footer-simple}"></div>
</body>
</html>
