<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
  <meta charset="UTF-8" />
  <title>SgOvi - Mis Actividades</title>
</head>
<body>

<div layout:fragment="content">
  <section class="form-container">

    <header class="app-header">
      <h1 class="title">Mis Actividades</h1>
      <p class="description">Gestione las actividades en las que participa.</p>
    </header>

    <div th:if="${param.status != null and param.status[0] == 'success_unsub'}" style="text-align: center; margin-bottom: 25px;">
        <span class="status-badge status-approved" style="display: inline-block; padding: 10px 20px; font-size: 15px;">
            ¡Te has dado de baja de la actividad correctamente!
        </span>
    </div>

    <form th:action="@{/Activity/list}" method="get" class="filter-bar" th:if="${activities != null and !activities.isEmpty()}">
      <div class="filter-group">
        <label for="sort">Ordenar por:</label>
        <select name="sort" id="sort" class="filter-select" onchange="this.form.submit()">
          <option value="dateDesc" th:selected="${currentSort == 'dateDesc'}">Fecha (Más recientes primero)</option>
          <option value="dateAsc" th:selected="${currentSort == 'dateAsc'}">Fecha (Más antiguas primero)</option>
          <option value="titleAsc" th:selected="${currentSort == 'titleAsc'}">Título (A - Z)</option>
        </select>
      </div>
    </form>

    <div class="table-responsive" th:if="${activities != null and !activities.isEmpty()}">
      <table class="table-custom">
        <thead>
        <tr style="text-align: center">
          <th>Título</th>
          <th>Tipo</th>
          <th>Fecha</th>
          <th class="text-right">Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="activity: ${activities}">
          <td><strong th:text="${activity.tittle}"></strong></td>
          <td>
            <span th:text="${activity.type.getDescription()}"></span>
          </td>
          <td th:text="${#temporals.format(activity.date, 'dd/MM/yyyy')}"></td>
          <td class="text-right">
            <div class="actions-group">
              <a th:href="@{/Activity/infoActivity/{id}(id=${activity.idActivity})}"
                 class="btn btn-primary btn-icon" title="Ver actividad">
                Detalles <i class="fi fi-rr-eye"></i>
              </a>
              <a th:href="@{/Activity/unsubscription/{id}(id=${activity.idActivity})}"
                 class="btn btn-secondary btn-icon" title="Darse de baja">
                Baja <i class="fi fi-rr-cross-small"></i>
              </a>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div th:if="${activities == null or activities.isEmpty()}" class="no-data-container">
      <p class="description">No tienes inscripciones activas en este momento.</p>
    </div>

    <div class="content-footer">
      <div class="nav-back">
        <a th:if="${session.rol == 'OVI_USER'}" th:href="@{/Ovi_User/menuOviUser}"
           class="btn btn-secondary btn-icon"
           title="Volver al menú">
          Menú<i class="fi fi-rr-home"></i>
        </a>
        <a th:if="${session.rol == 'PAP_PATI'}" th:href="@{/Pap_Pati/menuPapPati}"
           class="btn btn-secondary btn-icon"
           title="Volver al menú">
          Menú<i class="fi fi-rr-home"></i>
        </a>
      </div>
      <a th:href="@{/Activity/listAll}" class="btn btn-primary">Explorar más actividades</a>
    </div>

  </section>
  <div class="bottom-spacer"></div>
</div>

</body>
</html>
