<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <meta charset="UTF-8" />
    <title>SgOvi - Confirmar Cancelación</title>
</head>
<body>

<div layout:fragment="content">
    <section class="page-container">
        <header class="app-header">
            <h1 class="title">Confirmación de Baja</h1>
            <p class="description">¿Estás seguro de que deseas darte de baja de la siguiente actividad en la que estás inscrito?</p>
        </header>

        <div class="details-grid">
            <div class="detail-card full-width">
                <span class="detail-label">Título de la actividad:</span>
                <div class="detail-value" th:text="${activity.tittle}"></div>
            </div>

            <div class="detail-card full-width">
                <span class="detail-label">Descripción:</span>
                <div class="detail-value" th:text="${activity.description}"></div>
            </div>

            <div class="detail-card">
                <span class="detail-label">Fecha del evento:</span>
                <div class="detail-value" th:text="${#temporals.format(activity.date, 'dd/MM/yyyy')}"></div>
            </div>

            <div class="detail-card">
                <span class="detail-label">Tipo de actividad:</span>
                <div class="detail-value" th:text="${activity.type.getDescription()}"></div>
            </div>
        </div>

        <form th:action="@{/Activity/unsubscription}" method="post">
            <input type="hidden" name="idActivity" th:value="${activity.idActivity}" />

            <div class="content-footer">
                <div class="nav-back">
                    <a th:href="@{/Activity/list}" class="btn btn-secondary btn-icon" title="Volver al listado de mis actividades"> <i class="fi fi-rr-arrow-left"></i>Cancelar y volver</a>
                </div>
                <button type="submit" class="btn btn-secondary btn-icon" title="Darse de baja">
                     Darse de baja <i class="fi fi-rr-cross"></i>
                </button>
            </div>
        </form>

    </section>
    <div class="bottom-spacer"></div>
</div>

</body>
</html>
