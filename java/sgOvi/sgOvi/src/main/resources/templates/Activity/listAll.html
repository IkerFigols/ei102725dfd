<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <meta charset="UTF-8" />
    <title>SgOvi - Actividades Disponibles</title>
</head>
<body>

<div layout:fragment="content">
    <section class="form-container">

        <header class="app-header">
            <h1 class="title">Actividades Disponibles</h1>
            <p class="description">Explora todas las actividades programadas en las que puedes participar.</p>
        </header>

        <div class="table-responsive">
            <table class="table-custom">
                <thead>
                <tr>
                    <th>Título</th>
                    <th>Tipo</th>
                    <th>Descripción</th>
                    <th>Fecha</th>
                    <th>Capacidad</th>
                    <th>Sponsor</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="activity: ${activities}">
                    <td><strong th:text="${activity.tittle}"></strong></td>
                    <td th:text="${activity.type.getDescription()}"></td>
                    <td th:text="${activity.description}"></td>
                    <td th:text="${#temporals.format(activity.date, 'dd/MM/yyyy')}"></td>
                    <td th:text="${activity.capacity}"></td>
                    <td th:text="${activity.sponsor}"></td>
                    <td>
                        <a th:href="@{/Activity/signup/{id}(id=${activity.idActivity})}" class="btn btn-primary btn-sm">
                            Inscribirme
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <footer class="register-footer">
            <div class="button-group">
                <a th:href="@{/Activity/list}" class="btn btn-primary">Ver mis actividades</a>

                <a th:if="${session.rol == 'OVI_USER'}" th:href="@{/Ovi_User/menuOviUser}" class="btn btn-secondary">
                    Volver al Menú
                </a>

                <a th:if="${session.rol == 'PAP_PATI'}" th:href="@{/Pap_Pati/menuPapPati}" class="btn btn-secondary">
                    Volver al Menú
                </a>
            </div>
        </footer>

    </section>
</div>

</body>
</html>
