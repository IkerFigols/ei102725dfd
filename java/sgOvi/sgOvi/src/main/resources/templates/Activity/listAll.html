<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <meta charset="UTF-8" />
    <title>SgOvi - Actividades Disponibles</title>
</head>
<body>

<div layout:fragment="content">
    <section class="form-container">

        <header class="app-header">
            <h1 class="title">Actividades Disponibles</h1>
            <p class="description">
                <span th:if="${session.rol == 'OVI_USER'}">Explora las jornadas de divulgación disponibles.</span>
                <span th:if="${session.rol == 'PAP_PATI'}">Explora todas las actividades y cursos programados.</span>
            </p>
        </header>

        <form th:action="@{/Activity/listAll}" method="get" class="filter-bar" th:if="${activities != null and !activities.isEmpty()}">
            <div class="filter-group">
                <label for="sort">Ordenar por:</label>
                <select name="sort" id="sort" class="filter-select" onchange="this.form.submit()">
                    <option value="dateDesc" th:selected="${currentSort == 'dateDesc'}">Fecha (Más recientes primero)</option>
                    <option value="dateAsc" th:selected="${currentSort == 'dateAsc'}">Fecha (Más antiguas primero)</option>
                    <option value="titleAsc" th:selected="${currentSort == 'titleAsc'}">Título (A - Z)</option>
                </select>
            </div>
        </form>

        <div class="table-responsive" th:if="${activities != null and !activities.isEmpty()}">
            <table class="table-custom">
                <thead>
                <tr style="text-align: center">
                    <th>Título</th>
                    <th>Tipo</th>
                    <th>Fecha</th>
                    <th class="text-right">Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="activity: ${activities}"
                    th:if="${session.rol == 'PAP_PATI' or (session.rol == 'OVI_USER' and activity.type.name() == 'DISSEMINATION')}">

                    <td><strong th:text="${activity.tittle}"></strong></td>
                    <td>
                        <span th:text="${activity.type.getDescription()}"></span>
                    </td>
                    <td th:text="${#temporals.format(activity.date, 'dd/MM/yyyy')}"></td>
                    <td class="text-right">
                        <a th:href="@{/Activity/infoActivity/{id}(id=${activity.idActivity})}"
                           title="Ver actividad"
                           class="btn btn-primary">
                            Detalles <i class="fi fi-rr-eye"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${activities == null or activities.isEmpty()}" class="no-data-container">
            <p class="description">No hay actividades disponibles para tu perfil en este momento.</p>
        </div>

        <div class="content-footer">
            <div class="nav-back">
                <a th:if="${session.rol == 'OVI_USER'}" th:href="@{/Ovi_User/menuOviUser}" class="btn btn-secondary">
                    ← Volver al Menú
                </a>
                <a th:if="${session.rol == 'PAP_PATI'}" th:href="@{/Pap_Pati/menuPapPati}" class="btn btn-secondary">
                    ← Volver al Menú
                </a>
            </div>
            <a th:href="@{/Activity/list}"
               class="btn btn-primary">
                Mis actividades</a>
        </div>

    </section>
    <div class="bottom-spacer"></div>
</div>

</body>
</html>
