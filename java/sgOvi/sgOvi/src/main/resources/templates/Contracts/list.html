<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Mis Contratos</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1 class="main-title">Lista de Mis Contratos</h1>

<div th:if="${#lists.isEmpty(contracts)}" class="info-empty">
    <p>No tienes contratos registrados en este momento.</p>
</div>

<table th:if="${not #lists.isEmpty(contracts)}" class="data-table">
    <thead>
    <tr>
        <th>Id Contrato</th>
        <th>Fecha Inicio</th>
        <th>Fecha Fin</th>
        <th>Salario</th>
        <th>Documento</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="contract : ${contracts}">
        <td th:text="${contract.idContract}"></td>
        <td th:text="${contract.startDate}"></td>
        <td th:text="${contract.endDate != null ? contract.endDate : 'Vigente'}"></td>
        <td th:text="${contract.salary} + '€'"></td>
        <td th:text="${contract.document}"></td>
    </tr>
    </tbody>
</table>

<br><br>

<div class="navigation">
    <a th:href="${userType == 'oviUser'} ? @{/Ovi_User/menu} : @{/PapPati/menu}"
       class="btn-back">Volver al Menú Principal</a>
</div>

</body>
</html>
