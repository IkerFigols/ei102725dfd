<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <meta charset="UTF-8" />
    <title>SgOvi - Mis Contratos</title>
</head>
<body>

<div layout:fragment="content">
    <section class="form-container">

        <header class="app-header">
            <h1 class="title">Mis Contratos</h1>
            <p class="description">Listado de los contratos asociados a tu perfil.</p>
        </header>

        <div class="table-responsive" th:if="${contracts != null and !contracts.isEmpty()}">
            <table class="table-custom">
                <thead>
                <tr>
                    <th>Id Contrato</th>
                    <th>Fecha Inicio</th>
                    <th>Fecha Fin</th>
                    <th>Salario</th>
                    <th>Documento</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="contract : ${contracts}">
                    <td><strong th:text="${contract.idContract}"></strong></td>
                    <td th:text="${contract.startDate != null ? #temporals.format(contract.startDate, 'dd/MM/yyyy') : '--/--/----'}"></td>
                    <td th:text="${contract.endDate != null ? #temporals.format(contract.endDate, 'dd/MM/yyyy') : 'Vigente'}"></td>
                    <td th:text="${contract.salary != null ? contract.salary + '€' : '-'}"></td>
                    <td th:text="${contract.document}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${contracts == null or contracts.isEmpty()}" class="description" style="text-align: center; margin-top: 20px;">
            <p>No tienes contratos registrados en este momento.</p>
        </div>

        <footer class="register-footer">
            <a th:if="${session.rol == 'OVI_USER'}" th:href="@{/Ovi_User/menuOviUser}" class="btn btn-secondary">
                Volver al Menú
            </a>

            <a th:if="${session.rol == 'PAP_PATI'}" th:href="@{/Pap_Pati/menuPapPati}" class="btn btn-secondary">
                Volver al Menú
            </a>
        </footer>

    </section>
</div>

</body>
</html>
