<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <meta charset="UTF-8" />
    <title>SgOvi - Mis Contratos</title>
</head>
<body>

<div layout:fragment="content">
    <section class="form-container">

        <header class="app-header">
            <h1 class="title">Mis Contratos</h1>
            <p class="description">Listado de contratos vigentes y finalizados.</p>
        </header>

        <div class="filter-container">
            <form th:action="@{/Contracts/list}" method="get" class="filter-form">
                <div class="filter-group">
                    <label for="sortOrder">Ordenar por Fecha de Inicio:</label>
                    <select name="sort" id="sortOrder" class="filter-select" onchange="this.form.submit()">
                        <option value="dateDesc" th:selected="${currentSort == 'dateDesc'}">Más recientes primero</option>
                        <option value="dateAsc" th:selected="${currentSort == 'dateAsc'}">Más antiguos primero</option>
                    </select>
                </div>
            </form>
        </div>

        <div class="table-responsive" th:if="${contracts != null and !contracts.isEmpty()}">
            <table class="table-custom">
                <thead>
                <tr style="text-align: center">
                    <th>Contrato con</th>
                    <th>Fecha Inicio</th>
                    <th>Fecha Fin</th>
                    <th>Salario</th>
                    <th class="text-right">Documento</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="dto : ${contracts}">
                    <td><strong th:text="${dto.otherPersonName}"></strong></td>
                    <td th:text="${dto.contract.startDate != null ? #temporals.format(dto.contract.startDate, 'dd/MM/yyyy') : '--/--/----'}"></td>
                    <td th:text="${dto.contract.endDate != null ? #temporals.format(dto.contract.endDate, 'dd/MM/yyyy') : 'Vigente'}"></td>
                    <td th:text="${dto.contract.salary != null ? dto.contract.salary + '€' : '-'}"></td>
                    <td class="text-right">
                        <a th:href="@{/pdfs/contrato_tipo.pdf}" title="Ver documento"
                           target="_blank"
                           class="btn btn-primary btn-sm btn-icon">
                            Documento<i class ="fi fi-rr-document"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${contracts == null or contracts.isEmpty()}" class="no-data-container">
            <p class="description">No tienes contratos registrados en este momento.</p>
        </div>

        <div class="content-footer">
            <a th:if="${session.rol == 'OVI_USER'}" th:href="@{/Ovi_User/menuOviUser}" class="btn btn-secondary">
                ← Volver al Menú
            </a>
            <a th:if="${session.rol == 'PAP_PATI'}" th:href="@{/Pap_Pati/menuPapPati}" class="btn btn-secondary">
                ← Volver al Menú
            </a>
        </div>

    </section>
    <div class="bottom-spacer"></div>
</div>

</body>
</html>
