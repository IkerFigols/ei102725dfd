<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
  <title>Chat de Comunicación - SgOvi</title>
</head>
<body>

<div layout:fragment="content">
  <div class="page-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1 class="title" style="margin: 0;">Chat de Comunicación</h1>
    </div>

    <div>

    </div>
    <p th:if="${session.rol == 'OVI_USER'}" class="description"> Historial de mensajes con el asistente personal: <strong th:text="${nameP}"></strong></p>
    <p th:if="${session.rol == 'PAP_PATI'}" class="description"> Historial de mensajes con el usuario OVI: <strong th:text="${nameP}"></strong></p>

    <div class="chat-viewport">
      <div th:each="msg : ${communications}"
           th:with="isOvi=${session.rol == 'OVI_USER' and #strings.startsWith(msg.information, 'OviUser')},
                isPap=${session.rol == 'PAP_PATI' and #strings.startsWith(msg.information, 'PapPati')}"
           th:classappend="${isOvi or isPap} ? 'msg-bubble msg-me' : 'msg-bubble msg-other'">

        <span class="msg-info" th:text="${msg.date} + ' - ' + ${msg.idCommunication}"></span>
        <div th:text="${msg.information}"></div>
      </div>

      <div th:if="${#lists.isEmpty(communications)}" class="empty-list-container" >
        <p class="empty-list-text">No hay mensajes previos en esta conversación.</p>
      </div>
    </div>

    <form th:action="@{/Assistance_Request/communication/add (idAsReq= ${idAsReq})}" th:object="${comunication}" method="post">

      <input type="hidden" th:field="*{idSelection}" />

      <div class="textarea-container">
        <label class="title" style="font-size: 14px;">Escribir mensaje:</label>
        <textarea th:field="*{information}"
                  class="textarea-field-small"
                  style="min-height: 80px;"
                  placeholder="Escribe aquí tu mensaje..."
                  required></textarea>
      </div>

        <button type="submit" class="btn btn-primary btn-icon">Enviar Mensaje <i class="fi fi-rr-paper-plane"></i></button>

    </form>
    <div class="content-footer" style="margin-top: 30px;">
      <a th:if="${session.rol == 'OVI_USER'}"
         th:href="@{/Assistance_Request/papPatiSelection/{idAsReq}
          (idAsReq=${idAsReq})}"
         class="btn btn-secondary btn-icon" title="Volver al listado de selecciones">
        <i class="fi fi-rr-arrow-left"></i> Volver al listado
      </a>
      <a th:if="${session.rol == 'PAP_PATI'}"
         th:href="@{/Pap_Pati/papPatiAssistances/{idAsReq} (idAsReq=${idAsReq}, idSelection=${idSelection})}"
         class="btn btn-secondary btn-icon" title="Volver a los detalles de la asistencia">
        <i class="fi fi-rr-arrow-left"></i> Volver al listado
      </a>
    </div>
  </div>
</div>

</body>
</html>
