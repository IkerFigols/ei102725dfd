<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <title>Mis candidatos - SgOvi</title>
</head>
<body>

<div layout:fragment="content">
    <div class="page-container" style="max-width: 1000px;">

        <div class="button-group" style="margin-bottom: 20px;">
            <h1 class="title" style="margin: 0;">Mis candidatos para asistencia personal</h1>
        </div>

        <p class="description">A continuación se muestran los asistentes personales asignados a tu solicitud por el equipo técnico.</p>

        <div class="info-card-container" style="border: none; padding: 0;">
            <form th:action="@{/Assistance_Request/papPatiSelection/{idAsReq} (idAsReq= ${idAsReq})}" th:object="${filter}" method="get" class="filter-bar">
                <div class="filter-group">
                    <label for="filter-state">Filtrar por estado:</label>
                    <select id="filter-state" th:field="*{stateSel}" th:onchange="this.form.submit()" class="filter-select">
                        <option value="PENDING">Pendiente</option>
                        <option value="APPROVED">Aprobado</option>
                        <option value="REJECTED">Rechazado</option>
                        <option value="ALL">Todos</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filter-order">Ordenar por:</label>
                    <select id="filter-order" th:field="*{sortSel}" th:onchange="this.form.submit()" class="filter-select">
                        <option value="name">Nombre (A-Z)</option>
                        <option value="surname">Apellido (A-Z)</option>
                        <option value="city">Ciudad (A-Z)</option>
                    </select>
                </div>
            </form>
        </div>

        <div class="table-responsive" th:if="${!dtos.isEmpty()}">
            <table class="table-custom">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Ciudad</th>
                    <th>Estado Selección</th>
                    <th style="text-align: center;">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="dto: ${dtos}">
                    <td th:text="${dto.person.name}"></td>
                    <td th:text="${dto.person.surname}"></td>
                    <td th:text="${dto.person.city}"></td>
                    <td>
                        <span class="status-badge" th:classappend="${dto.selection.state.name() == 'APPROVED' ? 'status-approved' :
                                                (dto.selection.state.name() == 'PENDING' ? 'status-pending' : 'status-rejected' )}"
                                                th:text="${dto.selection.state.getDescription()}">
                        </span>
                    </td>
                    <td>
                        <div class="actions-group" style="justify-content: center;">
                            <a th:href="@{/Assistance_Request/papPatiInfo/{idPapPati}(idPapPati=${dto.selection.idPapPati}, idAsReq= ${dto.selection.idAsReq})}"
                               class="btn btn-primary btn-icon" title="Ver los detalles del asistente personal">
                                Detalles <i class="fi fi-rr-eye"></i>
                            </a>

                            <a th:href="@{/Assistance_Request/communication/{idSelection} (idSelection= ${dto.selection.idSelection}, idAsReq= ${dto.selection.idAsReq})}"
                               class="btn btn-primary btn-icon" title="Comunicarse con el asistente"> Chat <i class="fi fi-rr-comment-alt-dots"></i>
                            </a>
                            <th:block th:if="${dto.selection.state.name() == 'APPROVED'}">
                                <a th:href="@{/Contracts/add/{idSelection}(idSelection=${dto.selection.idSelection})}"
                                   class="btn btn-primary btn-icon" title="Crear un contrato">
                                    Añadir Contrato <i class="fi fi-rr-add-document"></i>
                                </a>
                            </th:block>


                            <form th:action="@{/Assistance_Request/approveSelection/{idSelection}(idSelection=${dto.selection.idSelection}, idAsReq=${dto.selection.idAsReq}, idPapPati= ${dto.selection.idPapPati})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-approved btn-icon"
                                        title="Aprobar Candidato"
                                        th:disabled="${dto.selection.state.name() == 'APPROVED'}"
                                        th:data-name="${dto.person.name}"
                                        onclick="return confirm('¿Seguro que elegirás al Asistente Person con nombre: ' + this.getAttribute('data-name')">
                                    Aprobar <i class="fi fi-rr-check"></i>
                                </button>
                            </form>

                            <form th:action="@{/Assistance_Request/rejectSelection/{idSelection}(idSelection=${dto.selection.idSelection}, idAsReq=${dto.selection.idAsReq})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-icon"
                                        title="Rechazar Candidato"
                                        th:disabled="${dto.selection.state.name() == 'REJECTED'}"
                                        th:data-name="${dto.person.name}"
                                        onclick="return confirm('¿Seguro que rechazarás al Asistente Person con nombre: ' + this.getAttribute('data-name')">>
                                    Rechazar <i class="fi fi-rr-cross"></i>
                                </button>
                            </form>

                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${#lists.isEmpty(dtos)}" class="empty-list-container">
            <p class="empty-list-text">
                No dispones de selecciones todavia.
            </p>
        </div>

        <div class="content-footer" style="margin-top: 30px;">
            <a th:href="@{/Assistance_Request/apRequestList}" class="btn btn-secondary btn-icon" title="Volver al listado"> <i class="fi fi-rr-arrow-left"></i> Volver al Listado</a>
        </div>
    </div>
</div>

</body>
</html>
