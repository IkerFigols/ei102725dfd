<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <meta charset="UTF-8">
    <title>Solicitar Asistencia - SgOvi</title>
</head>
<body>

<div layout:fragment="content">
    <div class="form-container">
        <h1 class="title">Nueva Solicitud de Asistencia</h1>
        <p class="description">Complete los campos para publicar su petición de asistencia personal.</p>

        <form th:action="@{/Assistance_Request/requestAssistance}" th:object="${assistanceRequest}" method="post">

            <input type="hidden" th:field="*{idOviUser}" />

            <div class="section-title">1. Información de la solicitud</div>

            <div class="textarea-container">
                <label class="detail-label" for="tittle">Título de la solicitud:</label>
                <input id="tittle" type="text" class="textarea-field-small" th:field="*{tittle}"
                       placeholder="Ej: Acompañamiento para gestiones médicas">
                <div th:if="${#fields.hasErrors('tittle')}" th:errors="*{tittle}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="description">Descripción detallada:</label>
                <textarea id="description" class="textarea-field" th:field="*{description}"
                          placeholder="Describa detalladamente las tareas y necesidades..."></textarea>
                <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </div>

            <div class="section-title">2. Perfil del asistente</div>

            <div class="textarea-container">
                <label class="detail-label" for="experience">Experiencia mínima (años):</label>
                <input id="experience" type="number" class="textarea-field-small" th:field="*{experience}" placeholder="Ej: 2">
                <div th:if="${#fields.hasErrors('experience')}" th:errors="*{experience}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="age">Edad mínima (años):</label>
                <input id="age" type="number" class="textarea-field-small" th:field="*{age}" placeholder="Ej: 18">
                <div th:if="${#fields.hasErrors('age')}" th:errors="*{age}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </div>

            <div class="textarea-container" style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
                <input id="drivingLicense" type="checkbox" th:field="*{drivingLicense}" style="width: 18px; height: 18px; cursor: pointer;">
                <label class="detail-label" for="drivingLicense" style="margin-bottom: 0;">¿Requiere carnet de conducir?</label>
            </div>

            <div class="section-title">3. Ubicación y Horario</div>

            <div class="textarea-container">
                <label class="detail-label" for="province">Provincia:</label>
                <input id="province" type="text" class="textarea-field-small" th:field="*{province}" placeholder="Ej: Castellón">
                <div th:if="${#fields.hasErrors('province')}" th:errors="*{province}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </div>

            <div class="section-title">4. Preferencia de Turno</div>

            <div class="textarea-container">
                <label class="detail-label" for="shiftPreference">Preferiencia de turno:</label>
                <select id="shiftPreference" name="shiftPreference" class="textarea-field-small" style="width: 200px;">
                    <option value="" th:selected="${assistanceRequest.shiftPreference == null}" disabled>Seleccione un turno</option>
                    <option th:each="shift : ${T(es.uji.ei1027.sgOvi.model.enums.ShiftType).values()}"
                            th:value="${shift.name()}"
                            th:text="${shift.getDescription()}"
                            th:selected="${assistanceRequest.shiftPreference == shift}">
                    </option>
                </select>
                <div th:if="${#fields.hasErrors('shiftPreference')}" th:errors="*{shiftPreference}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </div>

            <div class="button-group">
                <a th:href="@{/Assistance_Request/apRequestList}" class="btn btn-secondary">Cancelar</a>
                <button type="submit"
                        class="btn btn-primary"
                        onclick="return confirm('¿Seguro que deseas solicitar la asistencia ?');">
                    Solicitar Asistencia
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
