<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <meta charset="UTF-8">
    <title>Solicitar Asistencia - SgOvi</title>
</head>
<body>

<div layout:fragment="content">
    <div class="form-container">
        <h1 class="title">Motivo de la solicitud de asistencia</h1>
        <p class="description">Complete los siguientes campos para publicar su solicitud de asistencia personal.</p>

        <form th:action="@{/Assistance_Request/requestAssistance}" th:object="${assistanceRequest}" method="post">

            <input type="hidden" th:field="*{idOviUser}" />

            <div class="textarea-container">
                <label class="detail-label" for="tittle">Título de la asistencia:</label>
                <input id="tittle" type="text" class="textarea-field-small" th:field="*{tittle}" placeholder="Ej: Acompañamiento médico">
                <div th:if="${#fields.hasErrors('tittle')}" th:errors="*{tittle}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="description">Descripción del motivo:</label>
                <textarea id="description" class="textarea-field" th:field="*{description}"
                          placeholder="Describa detalladamente el motivo de su solicitud..."></textarea>
                <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}"
                     style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </div>


            <div class="textarea-container">
                <label class="detail-label" for="experience">Años de experiencia mínimos:</label>
                <input id="experience" type="number" class="textarea-field-small" th:field="*{experience}" placeholder="Ej: 2">
                <div th:if="${#fields.hasErrors('experience')}" th:errors="*{experience}"
                     style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </div>


            <div class="textarea-container">
                <label class="detail-label" for="age">Edad mínima del asistente:</label>
                <input id="age" type="number" class="textarea-field-small" th:field="*{age}" placeholder="Ej: 18">
                <div th:if="${#fields.hasErrors('age')}" th:errors="*{age}"
                     style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </div>

            <div class="textarea-container">
                <label class="detail-label" for="shiftPreference">¿Qué horario necesitas?</label>
                <select id="shiftPreference" name="shiftPreference" class="textarea-field-small">
                    <option value="">Seleccione un horario...</option>

                    <option th:each="shift : ${T(es.uji.ei1027.sgOvi.model.enums.ShiftType).values()}"
                            th:value="${shift.name()}"
                            th:text="${shift}"
                            th:selected="${assistanceRequest.shiftPreference == shift}">
                    </option>
                </select>
                <div th:if="${#fields.hasErrors('shiftPreference')}" th:errors="*{shiftPreference}"
                     style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </div>


            <div class="textarea-container" style="display: flex; align-items: center; gap: 10px;">
                <input id="drivingLicense" type="checkbox" th:field="*{drivingLicense}" style="width: 18px; height: 18px; cursor: pointer;">
                <label class="detail-label" for="drivingLicense" style="margin-bottom: 0;">¿Requiere carnet de conducir?</label>
            </div>


            <div class="textarea-container">
                <label class="detail-label" for="province">Provincia de la asistencia:</label>
                <input id="province" type="text" class="textarea-field-small" th:field="*{province}" placeholder="Ej: Castellón">
                <div th:if="${#fields.hasErrors('province')}" th:errors="*{province}"
                     style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
            </div>


            <div class="button-group" style="margin-top: 30px;">
                <button class="btn btn-secondary" type="button" onclick="window.history.back();">Volver</button>
                <button class="btn btn-primary" type="submit">Solicitar asistencia</button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
