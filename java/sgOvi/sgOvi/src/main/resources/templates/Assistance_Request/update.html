<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
  <meta charset="UTF-8" />
  <title>Actualizar Solicitud - SgOvi</title>
</head>
<body>

<div layout:fragment="content">
  <div class="form-container">
    <h1 class="title">Actualizar datos de la solicitud</h1>
    <p class="description">Modifica los campos necesarios para actualizar tu solicitud de asistencia personal.</p>

    <form th:action="@{/Assistance_Request/update}" th:object="${assistanceRequest}" method="post">
      <input type="hidden" th:field="*{idAsReq}" />
      <input type="hidden" th:field="*{idOviUser}" />
      <input type="hidden" name="state"th:value="*{state}" />

      <div class="textarea-container">
        <label class="detail-label" for="date">Fecha de registro:</label>
        <input id="date" type="date" th:field="*{date}" class="textarea-field-small">
        <div th:if="${#fields.hasErrors('date')}" th:errors="*{date}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
      </div>

      <div class="textarea-container">
        <label class="detail-label" for="description">Descripción del servicio:</label>
        <textarea id="description" th:field="*{description}" class="textarea-field" placeholder="Describe brevemente las tareas..."></textarea>
        <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
      </div>

      <div class="textarea-container">
        <label class="detail-label" for="age">Edad máxima deseada:</label>
        <input id="age" type="number" th:field="*{age}" class="textarea-field-small" placeholder="Ej: 45">
        <div th:if="${#fields.hasErrors('age')}" th:errors="*{age}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
      </div>

      <div class="textarea-container">
        <label class="detail-label" for="experience">Experiencia mínima (meses):</label>
        <input id="experience" type="number" th:field="*{experience}" class="textarea-field-small" placeholder="Ej: 12">
        <div th:if="${#fields.hasErrors('experience')}" th:errors="*{experience}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
      </div>

      <div class="textarea-container" style="display: flex; align-items: center; gap: 10px;">
        <input id="drivingLicense" type="checkbox" th:field="*{drivingLicense}" style="width: 18px; height: 18px; cursor: pointer;">
        <label class="detail-label" for="drivingLicense" style="margin-bottom: 0;">¿Requiere carnet de conducir?</label>
        <div th:if="${#fields.hasErrors('drivingLicense')}" th:errors="*{drivingLicense}" style="color: #ef4444; font-size: 0.85em;"></div>
      </div>

      <div class="textarea-container">
        <label class="detail-label" for="city">Ciudad:</label>
        <input id="city" type="text" th:field="*{city}" class="textarea-field-small" placeholder="Ej: Castellón">
        <div th:if="${#fields.hasErrors('city')}" th:errors="*{city}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
      </div>

      <div class="textarea-container">
        <label class="detail-label" for="province">Provincia:</label>
        <input id="province" type="text" th:field="*{province}" class="textarea-field-small" placeholder="Ej: Castellón">
        <div th:if="${#fields.hasErrors('province')}" th:errors="*{province}" style="color: #ef4444; font-size: 0.85em; margin-top: 5px;"></div>
      </div>

      <div class="textarea-container">
        <label class="detail-label" for="shiftPreference">Preferencia de horario:</label>
        <select id="shiftPreference" name="shiftPreference" class="textarea-field-small">
          <option th:each="shift : ${T(es.uji.ei1027.sgOvi.model.enums.ShiftType).values()}"
                  th:value="${shift}"
                  th:text="${shift.description}"
                  th:selected="${shift == assistanceRequest.shiftPreference}">
          </option>
        </select>
      </div>

      <div class="button-group" style="margin-top: 30px;">
        <a th:href="@{/Assistance_Request/apRequestList}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Actualizar Solicitud</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
