<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <meta charset="UTF-8" />
    <title>SgOvi - Mis Solicitudes</title>
</head>
<body>

<div layout:fragment="content">
    <section class="form-container" style="max-width: 1000px;">

        <header class="app-header">
            <h1 class="title">Mis solicitudes de asistencia personal</h1>
            <p class="description">Consulte el estado de sus peticiones y gestione sus asistentes.</p>
        </header>

        <div class="info-card" style="margin-bottom: 25px; background-color: var(--bg-light);">
            <form th:action="@{/Assistance_Request/apRequestList}" method="get" style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end;">

                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label class="detail-label" style="margin-bottom: 0;">Filtrar por estado:</label>
                    <select name="state" class="textarea-field-small" style="width: 200px;">
                        <option value="">Todos los estados</option>
                        <option value="PENDING" th:selected="${selectedState == 'PENDING'}">Pendiente</option>
                        <option value="APPROVED" th:selected="${selectedState == 'APPROVED'}">Aprobado</option>
                        <option value="REJECTED" th:selected="${selectedState == 'REJECTED'}">Rechazado</option>
                    </select>
                </div>

                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label class="detail-label" style="margin-bottom: 0;">Ordenar por:</label>
                    <select name="sort" class="textarea-field-small" style="width: 200px;">
                        <option value="date" th:selected="${selectedSort == 'date'}">Fecha (Más recientes)</option>
                        <option value="state" th:selected="${selectedSort == 'state'}">Estado</option>
                        <option value="tittle" th:selected="${selectedSort == 'tittle'}">Título (A-Z)</option>
                    </select>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-primary">Aplicar cambios</button>
                    <a th:href="@{/Assistance_Request/apRequestList}" class="btn btn-secondary">Limpiar</a>
                </div>
            </form>
        </div>

        <div class="table-responsive" th:if="${!assistanceRequests.isEmpty()}">
            <table class="table-custom">
                <thead>
                <tr>
                    <th>Título</th> <th>Fecha</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="assistanceRequest: ${assistanceRequests}">
                    <td th:text="${assistanceRequest.tittle}" style="font-weight: 600;"></td>
                    <td th:text="${#temporals.format(assistanceRequest.date, 'dd/MM/yyyy')}"></td>
                    <td>
                        <span class="status-badge"
                              th:classappend="${assistanceRequest.state.name() == 'APPROVED' ? 'status-approved' :
                                               (assistanceRequest.state.name() == 'PENDING' ? 'status-pending' :
                                               (assistanceRequest.state.name() == 'REJECTED' ? 'status-rejected' : ''))}"
                              th:text="${assistanceRequest.state.getDescription()}">
                        </span>
                    </td>
                    <td>
                        <div class="actions-group">
                            <a th:href="@{/Assistance_Request/details/{idAsReq} (idAsReq= ${assistanceRequest.idAsReq})}"
                               class="btn btn-secondary" style="padding: 5px 10px;">Detalles</a>

                            <a th:if="${assistanceRequest.state.name() == 'APPROVED'}"
                               th:href="@{/Assistance_Request/papPatiSelection/{idAsReq} (idAsReq= ${assistanceRequest.idAsReq})}"
                               class="btn btn-primary" style="padding: 5px 10px;">Elegir Asistente</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${assistanceRequests.isEmpty()}" style="text-align: center; padding: 40px;">
            <p class="description">No tienes solicitudes que coincidan con estos filtros.</p>
        </div>

        <div class="content-footer" style="margin-top: 30px;">
            <a th:href="@{/Ovi_User/menuOviUser}" class="btn btn-secondary">← Volver al Menú</a>
            <a th:href="@{/Assistance_Request/requestAssistance}" class="btn btn-primary">Nueva Solicitud</a>
        </div>

    </section>
</div>

</body>
</html>
