<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <title>Gestionar Assistance Request</title>
    <meta charset="UTF-8" />
</head>
<body>
<h1>Mis solicitudes de asistencia personal </h1>
<table>
    <thead>
    <tr>
        <th>idAsReq</th>
        <th>Fecha</th>
        <th>Descripcion</th>
        <th>Estado</th>
        <th>Razón</th>
        <th>Opcion</th>
        <td></td>
        <td></td>
    </tr>
    </thead>
    <tbody>
    <tr th:each="assistanceRequest: ${assistanceRequests}">
        <td th:text="${assistanceRequest.idAsReq}"></td>
        <td th:text="${assistanceRequest.data}"></td>
        <td th:text="${assistanceRequest.description}"></td>
        <td th:text="${assistanceRequest.idOviUser}"></td>
        <td th:text="${assistanceRequest.state}"></td>
        </td>
        <td th:text="${assistanceRequest.reason}"></td>
        <td th:if="assistanceRequest.state == 'APPROVED'">
            <a href="papPatiSelection">Seleccionar Asistente</a>
        </td>
        <td th:unless="assistanceRequest.state == 'APPROVED'">
            No disponible
        </td>
    </tr>
    </tbody>
</table>
<a href="requestAssistance">Solicitar Asistencia</a>
<br><br>
<a href="/" >Volver</a>
</body>
</html>
