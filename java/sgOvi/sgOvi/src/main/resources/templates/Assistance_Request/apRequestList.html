<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <meta charset="UTF-8" />
    <title>SgOvi - Mis Solicitudes</title>
</head>
<body>

<div layout:fragment="content">
    <section class="page-container" style="max-width: 1000px;">

        <header class="app-header">
            <h1 class="title">Mis solicitudes de asistencia personal</h1>
            <p class="description">Consulte el estado de sus peticiones y gestione sus asistentes.</p>
        </header>

            <div class="info-card-container" style="border: none; padding: 0;">
                <form th:action="@{/Assistance_Request/apRequestList}" th:object="${filter}" method="get" class="filter-bar">
                    <div class="filter-group">
                        <label for="filter-state">Filtrar por estado:</label>
                        <select id="filter-state" th:field="*{stateSel}" th:onchange="this.form.submit()" class="filter-select">
                            <option th:each="st : ${T(es.uji.ei1027.sgOvi.model.enums.State).values()}"
                                    th:value="${st.name()}"
                                    th:text="${st.getDescription()}">
                            </option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="filter-order">Ordenar por:</label>
                        <select id="filter-order" th:field="*{sortSel}" th:onchange="this.form.submit()" class="filter-select">
                            <option value="dateDesc">Fecha descendente</option>
                            <option value="dateAsc">Fecha ascendente</option>
                            <option value="tittle">Título (A-Z)</option>
                        </select>
                    </div>
                </form>
            </div>
        <div class="table-responsive" th:if="${!assistanceRequests.isEmpty()}">
            <table class="table-custom">
                <thead>
                <tr>
                    <th>Título</th> <th>Fecha</th>
                    <th>Estado</th>
                    <th style="text-align: center;">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="assistanceRequest: ${assistanceRequests}">
                    <td th:text="${assistanceRequest.tittle}" style="font-weight: 600;"></td>
                    <td th:text="${#temporals.format(assistanceRequest.date, 'dd/MM/yyyy')}"></td>
                    <td>
                        <span class="status-badge"
                              th:classappend="${assistanceRequest.state.name() == 'APPROVED' ? 'status-approved' :
                                                (assistanceRequest.state.name() == 'PENDING' ? 'status-pending' :
                                                (assistanceRequest.state.name() == 'REJECTED' ? 'status-rejected' :

                                                (assistanceRequest.state == 'CLOSED_WITH_CONTRACT' ? 'status-closed' : 'status-closed-done')))}"
                              th:text="${assistanceRequest.state.getDescription()}">
                        </span>
                    </td>
                    <td>
                        <div class="actions-group">
                            <a th:href="@{/Assistance_Request/details/{idAsReq} (idAsReq= ${assistanceRequest.idAsReq})}"
                               class="btn btn-primary btn-icon" style="padding: 5px 10px;" title="Ver detalles de la solicitud">Detalles <i class="fi fi-rr-eye"></i></a>

                            <a th:if="${assistanceRequest.state.name() == 'PENDING'}" th:href="@{/Assistance_Request/delete/{idAsReq} (idAsReq= ${assistanceRequest.idAsReq})}"
                               class="btn btn-primary btn-icon" style="padding: 5px 10px;" title="Eliminar solicitud"
                               onclick="return confirm('¿Seguro que deseas solicitar la asistencia ?');">
                                Eliminar <i class="fi fi-rr-cross"></i>
                            </a>
                            <a th:if="${assistanceRequest.state.name() == 'APPROVED'}"
                               th:href="@{/Assistance_Request/papPatiSelection/{idAsReq} (idAsReq= ${assistanceRequest.idAsReq})}"
                               class="btn btn-primary btn-icon" style="padding: 5px 10px;" title="Elegir asistente personal">Elegir Asistente  <i class="fi fi-rr-pencil"></i></a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${#lists.isEmpty(assistanceRequests)}" class="empty-list-container">
            <p class="empty-list-text">
                No dispones de asistencias personales.
            </p>
        </div>

        <div class="content-footer" style="margin-top: 30px;">
            <a th:href="@{/Ovi_User/menuOviUser}" class="btn btn-secondary btn-icon" title="Volver al menu de usuario">Volver al Menú <i class="fi fi-rr-home"></i></a>
            <a th:href="@{/Assistance_Request/requestAssistance}" class="btn btn-secondary btn-icon" title="Crear una nueva solicitud">Nueva Solicitud <i class="fi fi-rr-plus"></i></a>
        </div>

    </section>
</div>

</body>
</html>
