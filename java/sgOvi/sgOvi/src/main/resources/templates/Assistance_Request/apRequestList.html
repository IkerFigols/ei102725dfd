<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <title>Gestionar Assistance Request</title>
    <meta charset="UTF-8" />
</head>
<body>
<h1>Mis solicitudes de asistencia personal </h1>
<table th:unless="${assistanceRequests.isEmpty()}">
    <thead>
    <tr>
        <th>idAsReq</th>
        <th>Fecha</th>
        <th>Descripcion</th>
        <th>Estado</th>
        <th>Razón</th>
        <th>Opcion</th>
        <td></td>
        <td></td>
    </tr>
    </thead>
    <tbody>
    <tr th:each="assistanceRequests: ${assistanceRequests}">
        <td th:text="${assistanceRequests.idAsReq}"></td>
        <td th:text="${assistanceRequests.data}"></td>
        <td th:text="${assistanceRequests.description}"></td>
        <td th:text="${assistanceRequests.idOviUser}"></td>
        <td th:text="${assistanceRequests.state}"></td>
        </td>
        <td th:text="${assistanceRequests.reason}"></td>
        <td th:if="assistanceRequests.state == 'APPROVED'">
            <a href="papPatiSelection">Seleccionar Asistente</a>
        </td>
        <td th:unless="assistanceRequest.state == 'APPROVED'">
            No disponible
        </td>
    </tr>
    </tbody>
</table>
<h2 th:if="${assistanceRequests.isEmpty()}">No tienes asistencias activas en este momento</h2>
</tr>
<a href="requestAssistance">Solicitar Asistencia</a>
<br><br>
<a href="/" >Volver</a>
</body>
</html>
