<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/base}">
<head>
    <meta charset="UTF-8" />
    <title>SgOvi - Mis Solicitudes</title>
</head>
<body>

<div layout:fragment="content">
    <section class="form-container" style="max-width: 1000px;">

        <header class="app-header">
            <h1 class="title">Mis solicitudes de asistencia personal</h1>
            <p class="description">Consulte el estado de sus peticiones y gestione sus asistentes.</p>
        </header>

        <div style="margin-bottom: 25px; background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid var(--border-gray);">
            <form th:action="@{/Assistance_Request/apRequestList}" method="get" style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                <label class="description" style="margin-bottom: 0; font-weight: 600; color: var(--primary-blue);">Filtrar por estado:</label>

                <select name="state" class="textarea-field-small" style="width: auto; min-width: 180px; height: 38px;">
                    <option value="">Todos los estados</option>
                    <option value="PENDING" th:selected="${selectedState == 'PENDING'}">Pendiente</option>
                    <option value="APPROVED" th:selected="${selectedState == 'APPROVED'}">Aprobado</option>
                    <option value="REJECTED" th:selected="${selectedState == 'REJECTED'}">Rechazado</option>
                </select>

                <button type="submit" class="btn btn-primary" style="padding: 8px 20px;">Aplicar Filtro</button>
                <a th:href="@{/Assistance_Request/apRequestList}" class="btn btn-secondary" style="padding: 8px 20px;">Limpiar</a>
            </form>
        </div>

        <div class="table-responsive" th:if="${!assistanceRequests.isEmpty()}">
            <table class="table-custom">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th>Razón</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="assistanceRequest: ${assistanceRequests}">
                    <td th:text="${assistanceRequest.idAsReq}"></td>
                    <td th:text="${#temporals.format(assistanceRequest.date, 'dd/MM/yyyy')}"></td>
                    <td>
                            <span class="badge"
                                  th:classappend="${assistanceRequest.state.name() == 'APPROVED' ? 'badge-success' :
                                                   (assistanceRequest.state.name() == 'PENDING' ? 'badge-warning' : 'badge-info')}"
                                  th:text="${assistanceRequest.state.getDescription()}">
                            </span>
                    </td>
                    <td th:text="${assistanceRequest.reason}"></td>
                    <td>
                        <div class="actions-group">
                            <a th:href="@{/Assistance_Request/details/{idAsReq} (idAsReq= ${assistanceRequest.idAsReq})}"
                               class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;">Detalles</a>

                            <a th:if="${assistanceRequest.state.name() == 'APPROVED'}"
                               th:href="@{/Assistance_Request/papPatiSelection/{idAsReq} (idAsReq= ${assistanceRequest.idAsReq})}"
                               class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;">Seleccionar Asistente</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${assistanceRequests.isEmpty()}" style="text-align: center; padding: 40px;">
            <p class="description">No se han encontrado solicitudes con los criterios seleccionados.</p>
        </div>

        <div class="register-footer" style="margin-top: 30px; display: flex; justify-content: space-between; align-items: center;">
            <a th:href="@{/Ovi_User/menuOviUser}" class="btn btn-secondary">← Volver al Menú</a>
            <a th:href="@{/Assistance_Request/requestAssistance}" class="btn btn-primary">Nueva Solicitud</a>
        </div>

    </section>
</div>

</body>
</html>
